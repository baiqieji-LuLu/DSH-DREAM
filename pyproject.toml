[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "DSH-DREAM"
version = "0.5.0"
description = "A layered, auditable long-term memory and prompt-context plugin for LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "DSH-DREAM Contributors" },
]
keywords = [
  "agent",
  "chromadb",
  "llm",
  "memory",
  "rag",
  "retrieval",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "chromadb>=0.4.24,<0.5.0",
  "jinja2>=3.1.0",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=2.7.0",
]

[project.optional-dependencies]
llm = [
  "openai>=1.0.0",
]
onnx = [
  "onnxruntime>=1.17,<2",
  "tokenizers>=0.15,<1",
]
dev = [
  "build>=1.2.0",
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory"]

[tool.hatch.build.targets.sdist]
include = [
  "/AGENT_GUIDE.md",
  "/LICENSE",
  "/README.md",
  "/examples",
  "/manifest.json",
  "/dsh_plugin",
  "/pyproject.toml",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["agent_memory"]

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
  "if __name__ == \"__main__\":",
  "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
  "B",   # flake8-bugbear
  "E4",  # pycodestyle imports
  "E7",  # pycodestyle statements
  "E9",  # pycodestyle runtime
  "F",   # pyflakes
  "I",   # isort
  "RUF", # Ruff-specific rules
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["agent_memory"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/agent_memory"]
mypy_path = "src"
warn_unreachable = true
