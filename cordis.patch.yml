- insert:
    - id: dsh-dream-settings
      name: 'dsh-dream'
      meta:
        title: DSH-DREAM 长期记忆
      config:
        enable_memory: true
        max_window_tokens: 1500
        retrieval_top_k: 5
        embedding_provider: local
        embedding_model: ''
        embedding_api_key: ''
        embedding_base_url: ''
        auto_rebuild_collection: true
        holographic_mode: false
        # RouterEngine defaults: smart intent cutoff on, built-in local judge,
        # no external cloud model until the user fills one in.
        router_enabled: true
        router_mode: auto
        router_cloud_enabled: false
        router_cloud_provider: ''
        router_cloud_base_url: ''
        router_cloud_path: ''
        router_cloud_model: ''
        router_cloud_api_key_env: ''
